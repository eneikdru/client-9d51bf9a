<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запись к мастеру</title>
<style>body{font:17px system-ui;background:#f6f3ec;color:#183b36;max-width:900px;margin:60px auto;padding:24px}h1{font-size:48px}button,a{display:inline-block;background:#183b36;color:white;padding:12px 20px;border:0;border-radius:8px;margin:6px;text-decoration:none;cursor:pointer}article{background:white;padding:20px;margin:15px 0;border-radius:12px}#message{white-space:pre-wrap}</style>
<p>МАСТЕРА · ОНЛАЙН-ЗАПИСЬ</p><h1>Ваше время.<br>Ваш мастер.</h1><p>Выберите свободное время и подтвердите запись.</p>
<nav><a href="/auth/google">Войти через Google</a><a href="/auth/facebook">Войти через Facebook</a><button id="logout" hidden>Выйти</button></nav><p id="message" role="status"></p><h2>Свободное время</h2><main id="slots"></main><h2>Мои записи</h2><section id="bookings"></section><a href="/docs">API для агента</a>
<script>
let csrf='';const message=document.querySelector('#message');
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...options.headers}});const data=await r.json();if(!r.ok)throw Error(data.detail||'Ошибка запроса');return data}
function card(parent,text,label,action){const row=document.createElement('article');row.textContent=text;if(label){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{button.disabled=true;try{await action();await load()}catch(e){message.textContent=e.message;button.disabled=false}};row.append(button)}parent.append(row)}
async function load(){const s=document.querySelector('#slots'),b=document.querySelector('#bookings');s.replaceChildren();b.replaceChildren();let signed=false;try{const me=await api('/api/me');csrf=me.csrf;signed=true;document.querySelector('#logout').hidden=false}catch{}const slots=await api('/api/slots');if(!slots.length)s.textContent='Свободных окон пока нет.';for(const slot of slots){const key=crypto.randomUUID();card(s,`${slot.master} · ${slot.service} · ${new Date(slot.start*1000).toLocaleString()} · ${(slot.price/100).toFixed(2)} GEL`,signed?'Записаться':null,()=>api('/api/bookings',{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify({slot_id:slot.id})}))}if(signed)for(const item of await api('/api/bookings'))card(b,`${item.slot} · ${item.status}`,item.status==='confirmed'?'Отменить':null,()=>api(`/api/bookings/${encodeURIComponent(item.id)}/cancel`,{method:'POST'}))}
document.querySelector('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};load().catch(e=>message.textContent=e.message);
</script></html>
